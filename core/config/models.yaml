# Central model catalog. Roles may refer to catalog keys, API IDs, or other roles.
# Prices are USD per million tokens; omitted prices mean unknown, never free.
# OpenRouter entries may optionally set reasoning_effort (e.g. low/medium/high).
# Omit it to use provider defaults; accepted levels depend on the routed model.
# Reviewed 2026-10-17. Legacy entries do not imply continued provider availability.
# Training cutoffs researched 2026-10-19; informational only, with no runtime use.
# Quoted ISO dates preserve source precision: YYYY-MM or YYYY-MM-DD.
# Prefer published training-data cutoffs; otherwise use knowledge cutoffs as proxies.
# These are not dates of final post-training completion or guarantees against data leakage.
# ESTIMATE comments identify uncertain, conflicting, or family-inferred dates.
roles:
  debater: openrouter_gpt_oss_20b
  correct_debater: debater
  incorrect_debater: debater
  judge: openrouter_gpt_oss_20b
  preference: judge
  critic: debater
  critique_judge: judge
  cross_examiner: judge
  concession_judge: judge
groups:
  debaters:
  - openai_small
  - openai_balanced
  - openai_strong
  - anthropic_small
  - anthropic_balanced
  - anthropic_strong
  - openrouter_gpt_oss_20b
  - openrouter_gpt_oss_120b
  - openrouter_gpt_oss_20b
  - openrouter_gpt_oss_120b
  judges:
  - judge_4o_mini
  - judge_41_mini
  - judge_5_mini
  - openrouter_gpt_oss_20b
  - openrouter_gpt_oss_120b
  - openrouter_gpt_oss_20b
  - openrouter_gpt_oss_120b
profiles:
  openai_chat:
    provider: openai
    endpoint: chat
    sampling: true
    logprobs: true
    multiple_completions: true
    tokenizer: cl100k_base
    default_max_tokens: 2048
  openai_reasoning:
    provider: openai
    endpoint: responses
    sampling: false
    logprobs: false
    multiple_completions: false
    tokenizer: o200k_base
    default_max_tokens: 8192
  openai_base:
    provider: openai
    endpoint: completions
    sampling: true
    logprobs: true
    multiple_completions: true
    tokenizer: cl100k_base
    default_max_tokens: 2048
  anthropic_messages:
    provider: anthropic
    endpoint: messages
    sampling: false
    logprobs: false
    multiple_completions: false
    tokenizer: o200k_base
    default_max_tokens: 8192
    assistant_prefill: false
  anthropic_legacy:
    provider: anthropic
    endpoint: completions
    sampling: true
    logprobs: false
    multiple_completions: false
    tokenizer: cl100k_base
    default_max_tokens: 2048
  openrouter_chat:
    provider: openrouter
    endpoint: chat
    sampling: true
    logprobs: false
    multiple_completions: false
    tokenizer: o200k_base
    default_max_tokens: 8192
